# Test-only JWT signing key (Base64, 32 bytes)
jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Dummy Cloudinary credentials
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

# Default local datasource placeholders.
# Testcontainers overrides the connection for integration tests.
spring.datasource.url=jdbc:postgresql://localhost:5432/pawspot_test
spring.datasource.username=test
spring.datasource.password=test

# Hibernate creates the schema in the temporary test database
spring.jpa.hibernate.ddl-auto=create-drop

auth.cookie.secure=false
app.frontend.origin=http://localhost:5173

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
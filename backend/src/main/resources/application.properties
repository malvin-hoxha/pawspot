spring.application.name=pawspot

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

auth.cookie.secure=false
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Multipart uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Keep automatic cleanup disabled until the retention policy is finalized.
app.reports.cleanup.enabled=${REPORT_CLEANUP_ENABLED:false}
app.reports.cleanup.retention-days=${REPORT_RETENTION_DAYS:30}
app.reports.cleanup.cron=${REPORT_CLEANUP_CRON:0 0 3 * * *}

# Process persistent image deletion tasks in small batches.
app.images.cleanup.enabled=${IMAGE_CLEANUP_ENABLED:true}
app.images.cleanup.batch-size=${IMAGE_CLEANUP_BATCH_SIZE:20}
app.images.cleanup.delay-ms=${IMAGE_CLEANUP_DELAY_MS:60000}
app.images.cleanup.initial-delay-ms=${IMAGE_CLEANUP_INITIAL_DELAY_MS:60000}